name: Build Pino Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.PINO_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pino.jks"
            echo "PINO_KEYSTORE_FILE=$RUNNER_TEMP/pino.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No PINO_KEYSTORE_B64 secret: building with a throwaway debug key"
          fi

      - name: Build APK
        working-directory: android
        env:
          PINO_KEYSTORE_PASSWORD: ${{ secrets.PINO_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Publish to the "app" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk pino.apk
          gh release delete app --yes --cleanup-tag || true
          gh release create app pino.apk --title "Pino for Android" --latest \
            --notes "Tap pino.apk on your Android phone to download and install it. Build ${{ github.run_number }}."
