[build]
  publish = "public"
  command = "echo 'Pino has no build step'"

[functions]
  directory = "netlify/functions"

# Make sure browsers recognise the app manifest and always get the newest service worker
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/javascript; charset=utf-8"
